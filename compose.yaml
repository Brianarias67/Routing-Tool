services:
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      VALHALLA_URL: http://valhalla:8002
  valhalla:
    # Valhalla 3.9.1-f22153579, verified against the full sample on 2026-10-30.
    image: ghcr.io/valhalla/valhalla-scripted@sha256:f0556eec9720432337024ef3f29a9cb1ccd752f47ac057c58d3122209989d8da
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - valhalla-data:/custom_files
    environment:
      tile_urls: https://download.geofabrik.de/central-america/haiti-and-domrep-latest.osm.pbf
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "True"
      server_threads: "2"
volumes:
  valhalla-data:
